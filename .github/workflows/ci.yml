name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storyforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/storyforge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Proves the committed migrations apply to a clean database, and that the
      # schema has no changes missing a migration.
      - run: pnpm db:migrate
      - name: Schema has a migration
        run: |
          pnpm --filter @storyforge/db exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "Schema changed without a migration. Run pnpm db:generate and commit it."
            exit 1
          fi
